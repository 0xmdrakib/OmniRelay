port: 7880
logging:
  level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  allow_tcp_fallback: true
  turn_servers:
    - host: "REPLACE_WITH_PUBLIC_HOST"
      port: 3478
      protocol: udp
      secret: "REPLACE_WITH_TURN_SHARED_SECRET"
      ttl: 14400
keys:
  REPLACE_WITH_LIVEKIT_API_KEY: "REPLACE_WITH_LIVEKIT_API_SECRET"
room:
  auto_create: true
  empty_timeout: 60
  departure_timeout: 20
