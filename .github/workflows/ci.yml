name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history and files
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_DB: omnirelay
          POSTGRES_USER: omnirelay
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnirelay -d omnirelay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://omnirelay:ci-database-password@127.0.0.1:5432/omnirelay
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ci-livekit-key
      LIVEKIT_API_SECRET: ci-livekit-secret-at-least-32-characters
      INTEGRATION_BASE_URL: http://127.0.0.1:8080
      EXPECTED_LIVEKIT_URL: ws://127.0.0.1:7880
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and audit
        run: pnpm typecheck && pnpm audit
      - name: Build
        run: pnpm build
      - name: Build hardened runtime image
        run: docker build . --tag omnirelay-backend:ci
      - name: Start relay
        run: pnpm start > backend.log 2>&1 &
      - name: Wait for health check
        run: curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/healthz
      - name: Run unit and integration tests
        run: pnpm test
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-log
          path: backend/backend.log
          retention-days: 7

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omnirelay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
